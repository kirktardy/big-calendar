<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Big Calendar</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Calendar">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141416" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{--bg:#f6f5f2;--fg:#1b1b1f;--muted:#6b6964;--line:#e3e0da;--wknd:rgba(27,27,31,.05);--accent:#dc2626;--field:#efede9;
--glass:rgba(255,255,255,.58);--glass-b:rgba(255,255,255,.75);--glass-sh:0 8px 28px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.9);
--bar:rgba(246,245,242,.66);--sheet:rgba(255,255,255,.88);--sheet-b:rgba(255,255,255,.8)}
@media (prefers-color-scheme:dark){:root{--bg:#141416;--fg:#efeee9;--muted:#9a9993;--line:#2c2c31;--wknd:rgba(255,255,255,.055);--field:#2a2a2f;
--glass:rgba(44,44,48,.55);--glass-b:rgba(255,255,255,.14);--glass-sh:0 8px 28px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.12);
--bar:rgba(20,20,22,.64);--sheet:rgba(36,36,40,.88);--sheet-b:rgba(255,255,255,.12)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}
html{overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
#scroller{position:relative;min-height:100vh}
.dow{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);background:var(--bar);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:.5px solid var(--line)}
.dow span{text-align:center}
body.nodow .dow{display:none}
#weeks{margin:0 max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));padding-bottom:calc(env(safe-area-inset-bottom) + 120px)}
body.nodow #weeks{padding-top:calc(env(safe-area-inset-top) + 6px)}
.mrow{display:flex;align-items:baseline;gap:6px;padding:16px 4px 4px}
.mrow b{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:-.01em}
.mrow span{font-size:13px;font-weight:600;color:var(--muted)}
.week{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{position:relative;display:block;min-width:0;height:100%;padding:0;margin:0;border:0;background:transparent;text-align:left;cursor:pointer}
.day:active{background:color-mix(in srgb,var(--fg) 7%,transparent)}
body.wknd .day.we{background:var(--wknd)}
.n{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.day.past .n{color:var(--muted);font-weight:500}
.day.first .n{color:var(--accent);font-weight:800}
.day.today .n{top:3px;padding:3px 7px;border-radius:999px;background:var(--accent);color:#fff;font-weight:800}
.dots{position:absolute;top:27px;left:4px;right:4px;display:flex;flex-wrap:wrap;justify-content:center;gap:3px}
.dots i{width:7px;height:7px;border-radius:999px;flex:none}
.bars{position:absolute;left:0;right:0;top:25px;bottom:0;pointer-events:none}
.bar{position:absolute;height:18px;border-radius:6px;overflow:hidden}
.bar span{position:absolute;top:0;left:6px;right:4px;height:15px;font-size:11px;font-weight:700;line-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar i{position:absolute;left:0;bottom:0;height:3px;border-radius:2px}
.old{opacity:.45}
.g{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:.5px solid var(--glass-b);box-shadow:var(--glass-sh);color:var(--fg);cursor:pointer;display:grid;place-items:center}
.ctrl{position:fixed;left:20px;right:20px;bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;align-items:center;gap:12px;pointer-events:none;z-index:6}
.ctrl>button{pointer-events:auto}
.sp{flex:1}
.pill{height:50px;padding:0 22px;border-radius:999px;font-size:17px;font-weight:600}
.circ{width:50px;height:50px;border-radius:999px;padding:0}
.add{background:color-mix(in srgb,var(--accent) 90%,transparent);color:#fff;border-color:rgba(255,255,255,.35)}
.glass-sheet{background:var(--sheet);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border:.5px solid var(--sheet-b);box-shadow:0 20px 60px rgba(0,0,0,.25)}
.menu{position:fixed;left:20px;bottom:calc(env(safe-area-inset-bottom) + 78px);width:260px;border-radius:26px;padding:6px;z-index:9;display:none}
.menu.on{display:block}
.mi{display:flex;align-items:center;gap:10px;width:100%;height:48px;padding:0 14px 0 10px;border:0;border-radius:20px;background:transparent;font-size:17px;text-align:left;cursor:pointer}
.mi:active{background:color-mix(in srgb,var(--fg) 8%,transparent)}
.mi .ck{width:18px;display:grid;place-items:center;visibility:hidden}
.mi[aria-checked="true"] .ck{visibility:visible}
.sep{height:.5px;margin:0 14px;background:var(--line)}
.scrim{position:fixed;inset:0;z-index:8;border:0;padding:0;background:transparent;display:none}
.scrim.on{display:block}
.scrim.dim{background:rgba(0,0,0,.32)}
.sheet{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);max-width:520px;margin:0 auto;max-height:82dvh;overflow:auto;border-radius:34px;padding:8px 20px 22px;z-index:10}
.sheet{visibility:hidden;transform:translateY(calc(100% + 60px));transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s}
.sheet.on{visibility:visible;transform:none;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
.grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{margin:0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.sub{font-size:14px;font-weight:600;color:var(--muted)}
.ev{display:flex;gap:12px;align-items:stretch;width:100%;min-height:58px;padding:10px 0;border:0;border-bottom:.5px solid var(--line);background:none;text-align:left;cursor:pointer}
.ev i{width:8px;flex:none;border-radius:4px}
.ev b{display:block;font-size:16px;font-weight:700}
.ev small{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
label,.lbl{display:block;margin:14px 0 6px;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:0;background:var(--field);font-size:17px;-webkit-appearance:none;appearance:none}
textarea{min-height:64px;resize:vertical}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sw{display:flex;flex-wrap:wrap;gap:6px}
.sw button{width:44px;height:44px;border-radius:999px;border:3px solid transparent;cursor:pointer;padding:0}
.sw button[aria-pressed="true"]{border-color:var(--fg);box-shadow:inset 0 0 0 3px var(--bg)}
.btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px}
.btn{height:50px;border-radius:999px;border:0;background:var(--field);font-size:17px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--fg);color:var(--bg)}
.btn.del{color:#dc2626}
.btn.del.armed{background:#dc2626;color:#fff}
.btn.wide{width:100%;margin-top:16px}
.empty{color:var(--muted);padding:6px 0 4px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 50px);transform:translateX(-50%);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:12;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

.sh-head{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:8px;margin:0 -4px 6px}
.sh-head h3{text-align:center;font-size:17px;font-weight:600;letter-spacing:0}
.hb{width:44px;height:44px;border-radius:999px;border:0;padding:0;display:grid;place-items:center;background:color-mix(in srgb,var(--fg) 8%,transparent);cursor:pointer}
.hb.ok{background:var(--accent);color:#fff}
.hb:disabled{opacity:.35;cursor:default}
.ttl{width:100%;border:0;background:transparent;font-size:26px;font-weight:700;letter-spacing:-.02em;padding:8px 2px 4px;outline:none}
.ttl::placeholder{color:var(--muted);opacity:.7}
.auto{display:none;align-items:center;gap:8px;margin:4px 0 2px;padding:6px 6px 6px 12px;border-radius:999px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent);font-size:14px;font-weight:600;width:max-content;max-width:100%}
.auto.on{display:flex}
.auto button{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:14px;padding:4px 8px;cursor:pointer;min-height:32px}
.grp{background:var(--field);border-radius:16px;margin-top:12px;overflow:hidden}
.row{position:relative;display:flex;align-items:center;gap:10px;min-height:50px;padding:0 14px;font-size:17px}
.row+.row::before,.row+.sub2::before,.sub2+.row::before{content:"";position:absolute;top:0;left:14px;right:0;height:.5px;background:var(--line)}
.row .k{flex:1}
.vp{padding:6px 11px;border-radius:9px;background:color-mix(in srgb,var(--fg) 8%,transparent);font-weight:500;white-space:nowrap}
.row input.ov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0;padding:0;margin:0}
.dv{font-weight:500;min-width:62px;text-align:right}
.step{display:flex;align-items:center;border-radius:9px;background:color-mix(in srgb,var(--fg) 8%,transparent)}
.step button{width:46px;height:34px;border:0;background:transparent;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center}
.step i{width:.5px;height:18px;background:var(--line)}
.sub2{position:relative}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:999px;border:0;background:color-mix(in srgb,var(--fg) 8%,transparent);font-size:15px;font-weight:500;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.rowbtn{width:100%;border:0;background:transparent;text-align:left;cursor:pointer}
.cdot{width:24px;height:24px;border-radius:999px;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.chev{color:var(--muted);transition:transform .2s}
.chev.open{transform:rotate(90deg)}
.swr{display:none;align-items:center;justify-content:space-between;gap:2px;padding:6px 14px 14px}
.swr.on{display:flex}
.swr button,.swr label{position:relative;width:30px;height:30px;border-radius:999px;border:0;padding:0;cursor:pointer;flex:none}
.swr [aria-pressed="true"]{box-shadow:0 0 0 2px var(--field),0 0 0 4px var(--fg)}
.swr label{background:conic-gradient(#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,#007aff,#5856d6,#af52de,#ff2d55,#ff3b30);display:block}
.swr label input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;padding:0}
.notes{width:100%;min-height:80px;border:0;background:transparent;padding:14px;font-size:17px;resize:vertical;outline:none;display:block}
.delrow{width:100%;border:0;background:transparent;color:#dc2626;font-size:17px;min-height:50px;cursor:pointer}
.delrow.armed{background:#dc2626;color:#fff;font-weight:600}
.setup{position:fixed;inset:0;z-index:20;display:none;flex-direction:column;justify-content:center;gap:14px;padding:calc(env(safe-area-inset-top) + 24px) 24px calc(env(safe-area-inset-bottom) + 24px);background:var(--bg)}
.setup.on{display:flex}
.setup h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em}
.setup p{margin:0;color:var(--muted);font-size:16px;line-height:1.4}
.setup textarea{width:100%;min-height:110px;border:0;border-radius:16px;background:var(--field);padding:14px;font:15px ui-monospace,Menlo,monospace;resize:none}
.setup .err{color:#dc2626;font-weight:600;min-height:20px}
</style>
</head>
<body>
<div id="scroller">
<div class="dow" aria-hidden="true"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div>
<div id="weeks"></div>
</div>

<div class="ctrl">
<button type="button" class="g pill" id="b-today">Today</button>
<button type="button" class="g circ" id="b-more" aria-label="View options" aria-expanded="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
<span class="sp"></span>
<button type="button" class="g circ" id="b-view" aria-label="Collapse to dots"></button>
<button type="button" class="g circ add" id="b-add" aria-label="Add event"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
</div>

<button type="button" class="scrim" id="scrim" aria-label="Close"></button>
<div class="menu glass-sheet" id="menu" role="menu">
<button type="button" class="mi" role="menuitemcheckbox" id="m-dow"><span class="ck"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>Weekday Letters</span></button>
<div class="sep"></div>
<button type="button" class="mi" role="menuitemcheckbox" id="m-wknd"><span class="ck"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span>Shade Weekends</span></button>
<div class="sep" id="m-sep"></div>
<button type="button" class="mi" role="menuitem" id="m-export"><span class="ck" style="visibility:visible"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19h14"/></svg></span><span>Export Events (CSV)</span></button>
<div class="sep"></div>
<button type="button" class="mi" role="menuitem" id="m-sync"><span class="ck" style="visibility:visible"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/></svg></span><span id="m-synct">Sync Now</span></button>
</div>
<form class="setup" id="setup" novalidate>
<h1>Big Calendar</h1>
<p>Paste your connection code to load your events. It stays on this device only.</p>
<label for="s-code" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Connection code</label>
<textarea id="s-code" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec#key"></textarea>
<div class="err" id="s-err" role="alert"></div>
<button type="submit" class="btn pri" id="s-go">Connect</button>
</form>
<div class="sheet glass-sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
<div class="toast glass-sheet" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var DAY = 864e5, LANE = 21, MINH = 32;
  var COLORS = ['#b42318', '#c2410c', '#a16207', '#1f7a46', '#0f766e', '#1d6fb8', '#5b45c4', '#a3296a'];
  var MON = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var MS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WD = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var ICON_DOTS = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5.5" cy="12" r="2.4"/><circle cx="12" cy="12" r="2.4"/><circle cx="18.5" cy="12" r="2.4"/></svg>';
  var ICON_BARS = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M4 7h13M4 12h9M8 17h12"/></svg>';

  function $(id) { return document.getElementById(id); }
  var scroller = document.scrollingElement || document.documentElement, weeksEl = $('weeks'), sheet = $('sheet'), scrim = $('scrim'), menu = $('menu');

  var events = [];
  var prefs = { compact: false, dow: true, wknd: false };
  try { var lp = JSON.parse(localStorage.getItem('bigcal-prefs') || 'null'); if (lp && typeof lp === 'object') Object.assign(prefs, lp); } catch (e) {}
  var conn = null;
  try { conn = JSON.parse(localStorage.getItem('bigcal-conn') || 'null'); } catch (e) {}
  try { var cache = JSON.parse(localStorage.getItem('bigcal-cache') || 'null'); if (cache && Array.isArray(cache.events)) events = cache.events; } catch (e) {}
  var queue = [];
  try { queue = JSON.parse(localStorage.getItem('bigcal-queue') || '[]') || []; } catch (e) { queue = []; }
  var lastSync = null;

  var now = new Date();
  var today = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) / DAY;
  var baseY = now.getFullYear(), baseM = now.getMonth();
  var range = { from: -2, to: 6 };

  function toN(s) { var p = String(s).split('-'); return Date.UTC(+p[0], +p[1] - 1, +p[2]) / DAY; }
  function toS(n) { return new Date(n * DAY).toISOString().slice(0, 10); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function nice(n) { var d = new Date(n * DAY); return WD[d.getUTCDay()] + ', ' + MS[d.getUTCMonth()] + ' ' + d.getUTCDate(); }
  function rangeText(x) {
    if (x.s === x.e) return 'All day';
    var a = new Date(x.s * DAY), b = new Date(x.e * DAY);
    var sameY = a.getUTCFullYear() === b.getUTCFullYear();
    return MS[a.getUTCMonth()] + ' ' + a.getUTCDate() + (sameY ? '' : ', ' + a.getUTCFullYear()) + ' – ' +
      (a.getUTCMonth() === b.getUTCMonth() && sameY ? '' : MS[b.getUTCMonth()] + ' ') + b.getUTCDate() + (sameY ? '' : ', ' + b.getUTCFullYear()) +
      ' · ' + (x.e - x.s + 1) + ' days';
  }
  var mctx = document.createElement('canvas').getContext('2d');
  function textW(t) { mctx.font = '700 11px -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif'; return Math.ceil(mctx.measureText(t).width) + 14; }
  function validDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function ink(c) {
    var r = parseInt(c.slice(1, 3), 16) / 255, g = parseInt(c.slice(3, 5), 16) / 255, b = parseInt(c.slice(5, 7), 16) / 255;
    var L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
    if (L <= 0.42) return c;
    var f = 0.42 / L, h = function (v) { return ('0' + Math.round(v * f * 255).toString(16)).slice(-2); };
    return '#' + h(r) + h(g) + h(b);
  }
  function validColor(c) { return typeof c === 'string' && /^#[0-9a-fA-F]{6}$/.test(c) ? c : COLORS[5]; }

  function parsed() {
    return events.filter(function (e) { return validDate(e.start); }).map(function (e) {
      var s = toN(e.start), t = validDate(e.end) ? toN(e.end) : s;
      if (t < s) { var x = s; s = t; t = x; }
      return { ev: e, s: s, e: t, c: validColor(e.color), t: String(e.title || 'Untitled') };
    }).sort(function (a, b) { return a.s - b.s || (b.e - b.s) - (a.e - a.s); });
  }
  function onDay(n, evs) { return (evs || parsed()).filter(function (x) { return x.s <= n && x.e >= n; }); }
  function monthStart(off) { return Date.UTC(baseY, baseM + off, 1) / DAY; }

  function render() {
    var evs = parsed();
    var width = weeksEl.clientWidth || (window.innerWidth - 12);
    var colW = width / 7;
    var f0 = monthStart(range.from), l0 = monthStart(range.to + 1) - 1;
    var first = f0 - new Date(f0 * DAY).getUTCDay();
    var last = l0 + (6 - new Date(l0 * DAY).getUTCDay());
    var h = [];
    for (var ws = first; ws <= last; ws += 7) {

    if (t.hasAttribute('data-chip')) {
      var k = t.getAttribute('data-chip');
      if (k === 'wk') {
        var dow = new Date(form.start * DAY).getUTCDay();
        if (dow === 5) form.days = 3;
        else { if (dow !== 6) form.start += (6 - dow); form.days = 2; }
      } else form.days = +k;
      form.noAuto = true; form.auto = null; syncForm(); return;
    }
    var act = t.getAttribute('data-act');
    if (act === 'cancel') closeAll();
    else if (act === 'save') saveForm();
    else if (act === 'minus') { if (form.days > 1) form.days--; form.noAuto = true; form.auto = null; syncForm(); }
    else if (act === 'plus') { if (form.days < 366) form.days++; form.noAuto = true; form.auto = null; syncForm(); }
    else if (act === 'color') { form.colorOpen = !form.colorOpen; syncForm(); }
    else if (act === 'undo-auto') {
      if (form.before) { form.start = form.before.start; form.days = form.before.days; }
      form.auto = null; form.before = null; form.noAuto = true; syncForm();
    }
    else if (act === 'del') {
      if (!t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = 'Tap Again to Delete'; return; }
      deleteEvent(form.id);
    }
  });
  sheet.addEventListener('input', function (e) {
    if (!form) return;
    if (e.target.id === 'f-t') onTitleInput();
  });
  sheet.addEventListener('change', function (e) {
    if (!form) return;
    var id = e.target.id, v = e.target.value;
    if (id === 'f-s' && validDate(v)) { form.start = toN(v); form.noAuto = true; form.auto = null; syncForm(); }
    else if (id === 'f-e' && validDate(v)) { var en = toN(v); if (en < form.start) { form.start = en; form.days = 1; } else form.days = en - form.start + 1; form.noAuto = true; form.auto = null; syncForm(); }
    else if (id === 'f-cc' && /^#[0-9a-f]{6}$/i.test(v)) { form.color = v.toLowerCase(); syncForm(); }
  });
  sheet.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'f-t') { e.preventDefault(); saveForm(); } });

  weeksEl.addEventListener('click', function (e) {
    var d = e.target.closest('.day'); if (!d) return;
    var n = +d.getAttribute('data-n');
    if (onDay(n).length) openDay(n); else openForm(null, n);
  });

  // ---------- controls ----------
  function applyPrefs() {
    document.body.classList.toggle('nodow', !prefs.dow);
    document.body.classList.toggle('wknd', !!prefs.wknd);
    $('m-dow').setAttribute('aria-checked', String(!!prefs.dow));
    $('m-wknd').setAttribute('aria-checked', String(!!prefs.wknd));
    var v = $('b-view');
    v.innerHTML = prefs.compact ? ICON_BARS : ICON_DOTS;
    v.setAttribute('aria-label', prefs.compact ? 'Show event bars' : 'Collapse to dots');
  }
  function savePrefs() {
    try { localStorage.setItem('bigcal-prefs', JSON.stringify(prefs)); } catch (e) {}
    queue = queue.filter(function (o) { return o.action !== 'prefs'; });
    enqueue({ action: 'prefs', prefs: { compact: !!prefs.compact, dow: !!prefs.dow, wknd: !!prefs.wknd } });
  }
  function setPref(k, v) { prefs[k] = v; applyPrefs(); renderKeep(); savePrefs(); }

  $('b-today').addEventListener('click', function () { closeAll(); goToday(true); });
  $('b-add').addEventListener('click', function () { openForm(null, null); });
  $('b-view').addEventListener('click', function () { closeAll(); setPref('compact', !prefs.compact); });
  $('b-more').addEventListener('click', function () {
    if (mode === 'menu') { closeAll(); return; }
    closeAll(); mode = 'menu'; menu.classList.add('on'); scrim.classList.add('on');
    $('b-more').setAttribute('aria-expanded', 'true');
  });
  $('m-dow').addEventListener('click', function () { setPref('dow', !prefs.dow); });
  $('m-wknd').addEventListener('click', function () { setPref('wknd', !prefs.wknd); });
  $('m-export').addEventListener('click', function () {
    closeAll();
    var q = function (v) { v = String(v == null ? '' : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    var rows = [['Title', 'Start', 'End', 'Note', 'Color']].concat(parsed().map(function (x) { return [x.t, toS(x.s), toS(x.e), x.ev.note || '', x.c]; }));
    var csv = rows.map(function (r) { return r.map(q).join(','); }).join('\r\n') + '\r\n';
    var url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
    var a = document.createElement('a'); a.href = url; a.download = 'big-calendar-events-' + toS(today) + '.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
  });
  $('m-sync').addEventListener('click', function () { closeAll(); pull(false); });

  // ---------- boot ----------
  applyPrefs();
  render();
  goToday(false);
  if (!conn) showSetup('');
  else { flush(); pull(true); }
  document.addEventListener('visibilitychange', function () { if (!document.hidden && conn) { flush(); if (!lastSync || Date.now() - lastSync > 20000) pull(true); } });
  window.addEventListener('online', function () { flush(); });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
